<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <img src="https://wallpapers.com/images/featured/bts-utd6rlso6dvav5az.jpg" alt="" id="content" width="600" height="400" onmouseover="increse(this)" onmouseout="decrese(this)">

function increse(yam){
yam.style.width ="1000px";
yam.style.height = "600px";
}

function decrese(yam){
yam.style.width ="600px";
yam.style.height = "400px";
}
